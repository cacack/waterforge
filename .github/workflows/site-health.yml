name: Site health

# Watches the failure behind the 2026-09-05 and 2026-11-08 outages: GitHub
# Pages' Let's Encrypt renewal wedging in `bad_authz`, which happens whenever
# the Cloudflare proxy is on. The proxy is off for good (ADR 0025); the DNS
# check catches a record switched back to proxied, and the certificate *state*
# check is the early warning for a wedged renewal -- it goes bad ~30 days
# before the cert expires, while everything still looks fine to visitors.
#
# The domain-registration check has nothing to do with that outage and is here
# for the same reason: it fails invisibly. A renewal that does not go through
# produces no error anywhere until the name stops resolving. So does the
# release pipeline: when RELEASE_PLEASE_TOKEN expires, releases just stop.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: read
  issues: write

env:
  DOMAIN: waterforge.app
  # GitHub Pages' published addresses for an apex domain, and the CNAME target
  # for www. Anything else in the zone means the records no longer point
  # straight at Pages.
  PAGES_A: 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153
  PAGES_AAAA: 2606:50c0:8000::153 2606:50c0:8001::153 2606:50c0:8002::153 2606:50c0:8003::153
  PAGES_CNAME: cacack.github.io.
  EXPIRY_WARN_DAYS: 21
  # Wider than the certificate window on purpose: a stuck renewal is a support
  # ticket at a registrar, not something a CI fix or a redeploy can clear.
  DOMAIN_EXPIRY_WARN_DAYS: 45

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS points at GitHub Pages
        run: |
          set -uo pipefail
          # A proxied record wedges Pages' Let's Encrypt renewal in `bad_authz`
          # (#336), and nothing visibly breaks until the cert expires ~30 days
          # later. Proxied, Cloudflare answers the apex with its own anycast IPs
          # and flattens www's CNAME into A records, so both show up here.
          #
          # Ask the zone's authoritative nameserver directly so no resolver cache
          # can mask a change. A failed lookup warns rather than fails, like the
          # other checks' read failures.
          ns=$(dig +short NS "$DOMAIN" 2>/dev/null | head -1)
          if [ -z "$ns" ]; then
            echo "::warning::Could not resolve a nameserver for $DOMAIN; DNS check skipped."
            exit 0
          fi
          echo "Querying $ns"
          cause="likely re-proxied in Cloudflare; set it to DNS-only"

          # lookup TYPE NAME: print NAME's answer set for TYPE. Returns non-zero
          # when the query fails or the server answers anything but NOERROR
          # (SERVFAIL, REFUSED), so a nameserver hiccup warns instead of reading
          # as "no records".
          lookup() {
            local out
            out=$(dig +tries=2 +noall +comments +answer "$1" "$2" "@$ns") || return 1
            grep -q 'status: NOERROR' <<<"$out" || return 1
            awk -v t="$1" '!/^;/ && $4 == t {print $5}' <<<"$out" | sort -u
          }

          # check_set TYPE EXPECTED ALLOW_EMPTY: fail if the answer set is empty
          # (unless allowed) or holds any address outside EXPECTED.
          check_set() {
            local type=$1 expected=$2 allow_empty=$3 got shown unexpected
            if ! got=$(lookup "$type" "$DOMAIN"); then
              echo "::warning::$type lookup for $DOMAIN at $ns failed; skipped."
              return
            fi
            shown=$(echo "$got" | paste -sd ' ' -)
            echo "$DOMAIN $type: ${shown:-none}"
            if [ -z "$got" ]; then
              if [ "$allow_empty" != yes ]; then
                echo "FAIL: $DOMAIN has no $type records (expected $expected) -- $cause" >> "$RUNNER_TEMP/failures"
              fi
              return
            fi
            unexpected=$(comm -23 <(echo "$got") <(tr ' ' '\n' <<<"$expected" | sort -u))
            if [ -n "$unexpected" ]; then
              echo "FAIL: $DOMAIN $type returned $shown (expected only $expected) -- $cause" >> "$RUNNER_TEMP/failures"
            fi
          }
          check_set A "$PAGES_A" no
          check_set AAAA "$PAGES_AAAA" yes

          if ! cname=$(lookup CNAME "www.$DOMAIN"); then
            echo "::warning::CNAME lookup for www.$DOMAIN at $ns failed; skipped."
          else
            echo "www.$DOMAIN CNAME: ${cname:-none}"
            if [ "$cname" != "$PAGES_CNAME" ]; then
              echo "FAIL: www.$DOMAIN CNAME is '${cname:-none}' (expected $PAGES_CNAME) -- $cause" >> "$RUNNER_TEMP/failures"
            fi
          fi

      - name: Check Pages certificate state
        id: cert_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # GITHUB_TOKEN's reach into the Pages API is not guaranteed, so a read
          # failure downgrades to a warning rather than paging someone: the origin
          # certificate check below is an independent backstop that needs no API
          # access, and still fires ~21 days before an outage.
          if ! pages=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            echo "::warning::Could not read the Pages API; certificate-state check skipped. $pages"
            exit 0
          fi
          state=$(echo "$pages" | jq -r '.https_certificate.state // "absent"')
          echo "Certificate state: $state"
          if [ "$state" != "approved" ]; then
            desc=$(echo "$pages" | jq -r '.https_certificate.description // "no description"')
            echo "FAIL: Pages cert state is '$state' (expected 'approved') -- $desc" >> "$RUNNER_TEMP/failures"
          fi

      - name: Check origin certificate expiry
        run: |
          set -uo pipefail
          # Any Pages address serves the cert; the first one will do.
          origin_ip=${PAGES_A%% *}
          cert=$(echo | openssl s_client -connect "$origin_ip:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -outform pem 2>/dev/null)
          if [ -z "$cert" ]; then
            echo "FAIL: could not read origin certificate from $origin_ip" >> "$RUNNER_TEMP/failures"
            exit 0
          fi
          not_after=$(echo "$cert" | openssl x509 -noout -enddate | cut -d= -f2)
          # -checkend answers "will it expire within N seconds?" directly, so we
          # never have to parse OpenSSL's date format ourselves.
          if echo "$cert" | openssl x509 -noout -checkend $(( EXPIRY_WARN_DAYS * 86400 )) >/dev/null; then
            echo "Origin cert valid, expires $not_after (more than $EXPIRY_WARN_DAYS days out)"
          else
            echo "FAIL: origin cert expires within $EXPIRY_WARN_DAYS days (notAfter: $not_after)" >> "$RUNNER_TEMP/failures"
          fi

      - name: Check domain registration expiry
        run: |
          set -uo pipefail
          # RDAP publishes the expiry as a machine-readable field. rdap.org resolves
          # the right registry server from the IANA bootstrap, so a change of
          # registrar or TLD does not strand this check on a hardcoded endpoint.
          #
          # A read failure warns rather than fails. The renewal is also diarised in
          # the owner's calendar (docs/operations/continuity.md), so this is not the
          # only line of defence, and a flaky third-party redirector must not file an
          # issue every night.
          rdap=$(curl -sSL -m 30 "https://rdap.org/domain/$DOMAIN" 2>/dev/null)
          expiry=$(echo "$rdap" \
            | jq -r '[.events[]? | select(.eventAction == "expiration") | .eventDate] | first // empty' 2>/dev/null)
          if [ -z "$expiry" ]; then
            echo "::warning::No registration expiry found for $DOMAIN via RDAP; check skipped."
            exit 0
          fi
          if ! expiry_epoch=$(date -u -d "$expiry" +%s 2>/dev/null); then
            echo "::warning::Could not parse the RDAP expiry date '$expiry'; check skipped."
            exit 0
          fi
          days=$(( (expiry_epoch - $(date -u +%s)) / 86400 ))
          echo "Domain $DOMAIN expires $expiry ($days days out)"
          if [ "$days" -lt "$DOMAIN_EXPIRY_WARN_DAYS" ]; then
            echo "FAIL: $DOMAIN registration expires in $days days ($expiry) -- renew it at the registrar; nothing in CI can fix this" >> "$RUNNER_TEMP/failures"
          fi

      - name: Check release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # release-please runs daily and on every push to main, so its latest
          # completed run is never more than a day old. Any run that did not
          # succeed means releases have stopped -- most often because the PAT
          # expired, which leaves the site frozen at the last deploy with no
          # other symptom. A read failure warns, like the Pages API check above.
          if ! run=$(gh run list --repo "${{ github.repository }}" --workflow release-please.yml \
              --branch main --status completed --limit 1 \
              --json conclusion,createdAt,url --jq '.[0] // empty' 2>&1); then
            echo "::warning::Could not read release-please runs; check skipped. $run"
            exit 0
          fi
          if [ -z "$run" ]; then
            echo "::warning::No completed release-please run on main; check skipped."
            exit 0
          fi
          conclusion=$(echo "$run" | jq -r .conclusion)
          echo "Latest release-please run: $conclusion ($(echo "$run" | jq -r .createdAt))"
          if [ "$conclusion" != "success" ]; then
            echo "FAIL: latest release-please run on main concluded '$conclusion' -- $(echo "$run" | jq -r .url). If its log shows 'Bad credentials', rotate RELEASE_PLEASE_TOKEN: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/operations/ci-cd.md#one-time-manual-steps-repo-owner" >> "$RUNNER_TEMP/failures"
          fi

      - name: Check site is reachable
        run: |
          set -uo pipefail
          # Requests go straight to GitHub Pages, which has no bot management, so
          # curl's default UA is fine and any non-200 is a real failure: 404
          # (custom-domain auto-unset), 5xx, or 000 (no connection or a bad cert).
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/" || echo "000")
          echo "GET https://$DOMAIN/ -> $code"
          if [ "$code" != "200" ]; then
            echo "FAIL: https://$DOMAIN/ returned $code (expected 200)" >> "$RUNNER_TEMP/failures"
          fi

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Site health check failed for waterforge.app
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dedup by title rather than a label: repo labels are Terraform-managed
          # (git-repositories/labels.json taxonomy), so this workflow must not
          # depend on a label that module does not declare.
          open_issue=$(gh issue list --repo "$GH_REPO" --state open --search "in:title \"$TITLE\"" \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ ! -f "$RUNNER_TEMP/failures" ]; then
            echo "All checks passed."
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --repo "$GH_REPO" --comment "Site health checks are passing again as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing automatically."
            fi
            exit 0
          fi

          echo "::error::Site health checks failed"
          cat "$RUNNER_TEMP/failures"

          if [ -n "$open_issue" ]; then
            echo "Issue #$open_issue is already open; not filing a duplicate."
            exit 1
          fi

          {
            echo "Automated check failed at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo '```'
            cat "$RUNNER_TEMP/failures"
            echo '```'
            echo
            echo "Runbook: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/operations/cloudflare-pages.md"
            echo
            echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > body.md

          gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file body.md
          exit 1
