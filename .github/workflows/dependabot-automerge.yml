name: Dependabot auto-merge

# Dependabot has no auto-merge setting of its own — something has to call
# `gh pr merge --auto`. Patch and minor bumps merge themselves once CI and
# the required GitGuardian check pass; major bumps are left for review.

on: pull_request

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default, so the
# write scopes auto-merge needs must be requested explicitly.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # `--merge` because the branch ruleset allows only merge commits.
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
