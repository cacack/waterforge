name: Dependabot auto-merge

# Dependabot has no auto-merge setting of its own — something has to call
# `gh pr merge --auto`. Patch and minor bumps merge themselves once CI and
# the required GitGuardian check pass; major bumps are left for review.
#
# This workflow also rewrites the PR title into plain English, which every
# Dependabot PR needs regardless of whether it auto-merges.

# `edited` is on top of the default types because Dependabot rewrites the title
# when a newer version supersedes an open PR. If that edit lands after the push,
# the `synchronize` payload still carries the old title and the retitle below
# no-ops, letting a conventional title reach the merge commit. Re-running on
# `edited` cannot loop: the retitle is idempotent, and events raised by
# GITHUB_TOKEN do not trigger workflows (same reason release-please.yml uses a
# PAT).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default, so the
# write scopes auto-merge needs must be requested explicitly.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Rewrite the PR title in plain English
        # Dependabot derives the PR title from the commit subject, so the
        # `commit-message.prefix` from dependabot.yml lands in both, and a
        # conventional PR title would reach the merge commit body (the repo sets
        # merge_commit_message=PR_TITLE) where release-please counts it a second
        # time — the duplicate the pr-title job in ci.yml exists to prevent.
        #
        # This is NOT what protects the auto-merge path; the explicit --body
        # below does, because the title is a value Dependabot also writes and
        # rewrites on every rebase, so it cannot be relied on. This step keeps
        # the PR list readable and covers major bumps, which are merged by hand.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PLAIN=$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//')

          if [ "$PLAIN" = "$TITLE" ]; then
            echo "Title is not in conventional format; leaving as-is."
            exit 0
          fi

          # Capitalise the first letter so the result reads as a sentence:
          # 'fix(deps): bump svelte ...' -> 'Bump svelte ...'
          PLAIN=$(printf '%s' "$PLAIN" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')

          gh pr edit "$PR_URL" --title "$PLAIN"
          echo "Retitled: '$TITLE' -> '$PLAIN'"

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Classify update
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS: ${{ steps.metadata.outputs.previous-version }}
          NEW: ${{ steps.metadata.outputs.new-version }}
        run: |
          set -euo pipefail

          allow() { echo "allow=true"  >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }
          deny()  { echo "allow=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              allow "Dependabot classified this as ${UPDATE_TYPE#version-update:}." ;;
            version-update:semver-major)
              deny "Major update — leaving for manual review." ;;
          esac

          # Dependabot omits update-type for indirect (transitive) dependencies,
          # so fall back to comparing the major component ourselves. Anything
          # that does not parse cleanly is left for manual review.
          major() { echo "$1" | grep -oE '^[0-9]+' || true; }
          prev_major=$(major "$PREVIOUS")
          new_major=$(major "$NEW")

          if [ -z "$prev_major" ] || [ -z "$new_major" ]; then
            deny "Cannot parse versions ('$PREVIOUS' -> '$NEW') — leaving for manual review."
          fi

          if [ "$prev_major" = "$new_major" ]; then
            allow "Update within major $new_major ($PREVIOUS -> $NEW)."
          fi

          deny "Major update ($PREVIOUS -> $NEW) — leaving for manual review."

      - name: Enable auto-merge
        if: steps.classify.outputs.allow == 'true'
        # `--merge` because the branch ruleset allows only merge commits.
        #
        # --subject/--body are explicit because GitHub snapshots the merge commit
        # message when auto-merge is *enabled*, not when it fires. Left to the
        # repo default (merge_commit_message=PR_TITLE) it would freeze whatever
        # the title happened to be at that instant — and Dependabot resets the
        # title to conventional format on every rebase, so that value is a race.
        # An empty body leaves the branch commit as release-please's only input.
        run: |
          set -euo pipefail
          gh pr merge --auto --merge \
            --subject "Merge pull request #${PR_NUMBER} from ${OWNER}/${HEAD_REF}" \
            --body '' \
            "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
