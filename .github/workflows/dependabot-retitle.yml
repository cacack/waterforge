name: Dependabot PR title

# Rewrites Dependabot's PR title into plain English. Dependabot derives the
# title from the commit subject, so the `commit-message.prefix` from
# dependabot.yml lands in both and every Dependabot PR arrives in conventional
# format.
#
# This is cosmetic, and deliberately separate from dependabot-automerge.yml.
# What protects the merge commit from a conventional title is the explicit
# --subject/--body the called workflow passes, not this step: the title is a
# value Dependabot rewrites on every rebase, so it cannot be relied on at merge
# time. This keeps the PR list readable and covers majors, which are merged by
# hand and so never reach the auto-merge path at all.
#
# `edited` is on top of the default types because Dependabot rewrites the title
# when a newer version supersedes an open PR. If that edit lands after the push,
# the `synchronize` payload still carries the old title and the rewrite below
# no-ops. Re-running on `edited` cannot loop: the rewrite is idempotent, and
# events raised by GITHUB_TOKEN do not trigger workflows (the same reason
# release-please.yml uses a PAT).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Dependabot-triggered runs get a read-only GITHUB_TOKEN by default, so the
# write scope the edit needs must be requested explicitly.
permissions:
  contents: read
  pull-requests: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Rewrite the PR title in plain English
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PLAIN=$(printf '%s' "$TITLE" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//')

          if [ "$PLAIN" = "$TITLE" ]; then
            echo "Title is not in conventional format; leaving as-is."
            exit 0
          fi

          # Capitalise the first letter so the result reads as a sentence:
          # 'fix(deps): bump svelte ...' -> 'Bump svelte ...'
          PLAIN=$(printf '%s' "$PLAIN" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')

          gh pr edit "$PR_URL" --title "$PLAIN"
          echo "Retitled: '$TITLE' -> '$PLAIN'"
