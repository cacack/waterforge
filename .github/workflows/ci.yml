name: CI

# `check` guards main as well as PRs. GitGuardian is the only *required* status
# check in the ruleset, so a red `check` never blocks a merge and main can go
# green-to-red unnoticed — it did, for five days, after a
# prettier-plugin-tailwindcss bump auto-merged with `check` already failing.
# A run on main also disambiguates a red PR: branch's fault, or already broken?
#
# The schedule is not redundant with the push trigger. Dependabot auto-merges
# land via GITHUB_TOKEN, and GITHUB_TOKEN events do not fan out — the same rule
# that forces the PAT in release-please.yml — so the merges most likely to
# break main raise no push event at all. The daily sweep catches those.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  pr-title:
    runs-on: ubuntu-latest
    # Reads github.event.pull_request.*, which is empty on push and schedule.
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title is not conventional-commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          # Exempt release-please's own release PRs.
          if echo "$TITLE" | grep -qE "^chore\(main\): release [0-9]"; then
            echo "Release-please PR exempt."
            exit 0
          fi

          # Exempt Dependabot — its PRs use conventional titles by default
          # and don't drive release-please entries we care about deduping.
          if [ "$PR_USER" = "dependabot[bot]" ]; then
            echo "Dependabot PR exempt."
            exit 0
          fi

          # PR titles in conventional-commit format end up in the merge
          # commit body, which release-please then re-parses — producing a
          # duplicate changelog entry alongside the branch commit. Keep PR
          # titles in plain English; reserve conventional format for the
          # individual commit messages on the branch.
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:"
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title looks like a conventional commit ('$TITLE')."
            echo "Use a plain descriptive title (e.g. 'Add date parsing'), not 'feat(date): ...'."
            echo "Conventional format belongs in the branch commits, not the PR title."
            exit 1
          fi

          echo "PR title OK: $TITLE"

  commit-types:
    runs-on: ubuntu-latest
    # Same as pr-title: without a PR payload the base..head range is empty.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check branch commits use release-driving conventional types
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot commits are already conventional; don't second-guess them.
          if [ "$PR_USER" = "dependabot[bot]" ]; then
            echo "Dependabot PR exempt."
            exit 0
          fi

          # release-please recognises only this set; any other type ships with no
          # version bump and no changelog entry. PR titles stay plain English
          # (see the pr-title job) — this rule applies to the branch commits.
          ALLOWED='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:'

          fail=0
          # Non-merge commits introduced by this branch (base..head).
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            subject=$(git log -1 --format=%s "$sha")
            if echo "$subject" | grep -qE "$ALLOWED"; then
              continue
            fi
            fail=1
            type=$(echo "$subject" | sed -E 's/[(:!].*//')
            echo "::error::Not a conventional commit: $sha \"$subject\""
            case "$type" in
              data|profile|profiles|chem|chemistry|salt|salts|water)
                echo "  '$type' is not a release-please type. Profile data, chemistry, and salt changes are user-facing — use 'feat' (new data/capability) or 'fix' (correcting values/behaviour), e.g. 'feat($type): ...'." ;;
              *)
                echo "  Use a conventional type: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert (optional scope), e.g. 'feat(salts): ...'." ;;
            esac
          done

          if [ "$fail" -eq 0 ]; then
            echo "All branch commits use valid conventional types."
          fi
          exit $fail
