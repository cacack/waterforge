name: Dependabot watch

# Stub. The logic lives in cacack/workflows so a fix lands in one place instead
# of drifting per repo -- see that repo's README for what it does and why.
#
# What stays here: the schedule (a workflow_call workflow cannot declare one),
# and the two values that are waterforge's own rather than the shared default --
# the grace period and the decision record it comes from.

on:
  schedule:
    # Offset from site-health.yml's 17 13 * * * so the two don't contend.
    - cron: '43 13 * * *'
  workflow_dispatch:
    inputs:
      grace_days:
        description: Grace period in days (overrides the ADR 0017 default of 7)
        required: false

# Must grant at least what the called job declares, or GitHub rejects the call
# with `startup_failure` before any step runs and with no log explaining it.
# `issues: write` is the one to get right: without it the watch would detect a
# stale advisory and then be unable to tell anyone, which is the failure it
# exists to prevent.
permissions:
  contents: read
  issues: write

jobs:
  watch:
    uses: cacack/workflows/.github/workflows/dependabot-watch.yml@09e64312f66e291b6aa14c4d3f4b55c2ec26ea1b # v2.1.0
    with:
      # Empty on a scheduled run, which the called workflow resolves to its
      # default of 7 -- the same number ADR 0017 sets. Passed through rather
      # than restated so a dispatch override reaches it.
      grace-days: ${{ inputs.grace_days }}
      # ADR 0017 is the authoritative home for the 7 days, not the shared
      # workflow's default. Passing it makes the filed issue cite that decision.
      threshold-doc-url: https://github.com/cacack/waterforge/blob/main/docs/decisions/0017-maintenance-thresholds.md
    secrets:
      # Mapped by name rather than `secrets: inherit`, which would hand the
      # called workflow every secret this repo holds when it declares two.
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
