name: Release Please

# The push trigger misses anything merged by a bot: auto-merged Dependabot PRs
# land via GITHUB_TOKEN, and GITHUB_TOKEN events do not fan out (the same rule
# that forces the PAT below). A week of pure-Dependabot activity would otherwise
# accumulate releasable `fix(deps):` commits on main with no release PR ever
# opened. The daily sweep picks those up regardless of who merged them.
#
# release-please is idempotent — it opens the release PR or updates the existing
# one — so the extra runs are free.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT (not GITHUB_TOKEN) so the resulting release: published
          # event triggers downstream workflows like deploy.yml. Events
          # generated by GITHUB_TOKEN do not fan out — by design, to prevent
          # workflow loops. See ADR 0010.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
