name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT (not GITHUB_TOKEN) so the resulting release: published
          # event triggers downstream workflows like deploy.yml. Events
          # generated by GITHUB_TOKEN do not fan out — by design, to prevent
          # workflow loops. See ADR 0010.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
